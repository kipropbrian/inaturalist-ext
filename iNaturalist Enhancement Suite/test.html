<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LiteRT.js Object Detection Test (YOLOv8n)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 20px;
      background: #fdfdfd;
      color: #333;
    }
    h1 { color: #111; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .control-panel {
      background: #f0f4f8;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    select, button {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
    }
    button {
      background: #74ac00;
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #629100;
    }
    button:disabled {
      background: #ccc;
      cursor: default;
    }
    .container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .canvas-container {
      background: #fff;
      padding: 15px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      text-align: center;
    }
    canvas {
      border: 1px solid #cbd5e1;
      background: #000;
      margin-top: 10px;
    }
    .results {
      flex: 1;
      background: #fff;
      padding: 15px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }
    #log-output {
      flex: 1;
      font-family: monospace;
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
      background: #f8fafc;
      padding: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      margin-top: 10px;
    }
    .status {
      font-weight: bold;
      padding: 12px;
      background: #edf2f7;
      border-left: 4px solid #4a5568;
      border-radius: 0 4px 4px 0;
      margin-bottom: 20px;
    }
    .status.success {
      background: #f0f7e8;
      border-left-color: #74ac00;
      color: #416600;
    }
    .status.warning {
      background: #fff8e1;
      border-left-color: #ead38a;
      color: #765500;
    }
    .status.error {
      background: #fff0f0;
      border-left-color: #e4b4b4;
      color: #8b2f2f;
    }
  </style>
  
  <!-- Load standard WASM loader synchronously -->
  <script src="lib/litert/wasm/litert_wasm_internal.js"></script>
  <script>
    window.StandardModuleFactory = ModuleFactory;
    window.ModuleFactory = undefined; // Clean up global
  </script>
  
  <!-- Load main LiteRT library -->
  <script src="lib/litert/litert.js"></script>
</head>
<body>
  <h1>LiteRT.js YOLOv8-nano Interactive Test Playground</h1>
  <div id="status-bar" class="status">Initializing LiteRT.js environment...</div>
  
  <div class="control-panel">
    <label for="image-select"><strong>Select Test Case Image:</strong></label>
    <select id="image-select">
      <option value="https://inaturalist-open-data.s3.amazonaws.com/photos/695191825/original.jpg">Grasshopper #1 (Tall Frame)</option>
      <option value="https://inaturalist-open-data.s3.amazonaws.com/photos/695191906/original.jpg">Grasshopper #2 (On leaves)</option>
      <option value="https://inaturalist-open-data.s3.amazonaws.com/photos/695079098/original.jpg">Rat/Mouse (Horizontal)</option>
      <option value="https://inaturalist-open-data.s3.amazonaws.com/photos/695068131/large.jpg">Test Organism #3</option>
      <option value="https://static.inaturalist.org/photos/695048343/original.jpg">Test Organism #4 (Stick Insect)</option>
    </select>
    <button id="run-btn" disabled>Run Object Detection</button>
  </div>

  <div class="container">
    <div class="canvas-container">
      <h3>Preprocessed Input & Bounding Box</h3>
      <p style="font-size: 12px; color: #666; margin: 0;">(192x192 with letterbox padding drawn)</p>
      <canvas id="canvas" width="192" height="192"></canvas>
    </div>
    <div class="results">
      <h3>Detection Console Log</h3>
      <div id="log-output"></div>
    </div>
  </div>

  <script>
    const COCO_CLASSES = [
      'person', 'bicycle', 'car', 'motorcycle', 'airplane', 'bus', 'train', 'truck', 'boat', 'traffic light',
      'fire hydrant', 'stop sign', 'parking meter', 'bench', 'bird', 'cat', 'dog', 'horse', 'sheep', 'cow',
      'elephant', 'bear', 'zebra', 'giraffe', 'backpack', 'umbrella', 'handbag', 'tie', 'suitcase', 'frisbee',
      'skis', 'snowboard', 'sports ball', 'kite', 'baseball bat', 'baseball glove', 'skateboard', 'surfboard',
      'tennis racket', 'bottle', 'wine glass', 'cup', 'fork', 'knife', 'spoon', 'bowl', 'banana', 'apple',
      'sandwich', 'orange', 'broccoli', 'carrot', 'hot dog', 'pizza', 'donut', 'cake', 'chair', 'couch',
      'potted plant', 'bed', 'dining table', 'toilet', 'tv', 'laptop', 'mouse', 'remote', 'keyboard', 'cell phone',
      'microwave', 'oven', 'toaster', 'sink', 'refrigerator', 'book', 'clock', 'vase', 'scissors', 'teddy bear',
      'hair drier', 'toothbrush'
    ];

    const logEl = document.getElementById('log-output');
    const statusEl = document.getElementById('status-bar');
    const canvas = document.getElementById('canvas');
    const runBtn = document.getElementById('run-btn');
    const imageSelect = document.getElementById('image-select');
    const ctx = canvas.getContext('2d');

    let compiledModel = null;

    function log(msg) {
      console.log(msg);
      logEl.innerText += msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(text, type = 'info') {
      statusEl.innerText = text;
      statusEl.className = 'status ' + type;
    }

    function sigmoid(x) {
      return 1 / (1 + Math.exp(-x));
    }

    async function initEnvironment() {
      try {
        log('Warming LiteRT environment...');
        window.Module = {
          locateFile: (path) => 'lib/litert/wasm/' + path,
          print: (text) => {
            if (text && (text.startsWith('INFO:') || text.startsWith('WARNING:'))) return;
            console.log(text);
          },
          printErr: (text) => {
            if (text && (text.startsWith('INFO:') || text.startsWith('WARNING:'))) return;
            console.warn(text);
          }
        };

        await LiteRT.loadLiteRt('lib/litert/wasm/');
        log('LiteRT runtime loaded successfully.');

        log('Compiling YOLOv8-nano model...');
        compiledModel = await LiteRT.loadAndCompile('lib/litert/models/yolov8n.tflite');
        log('YOLOv8-nano compiled successfully on CPU.');

        setStatus('LiteRT loaded. Ready to run tests.', 'success');
        runBtn.disabled = false;
      } catch (err) {
        log('Initialization Error: ' + err.stack);
        setStatus('Failed to load LiteRT: ' + err.message, 'error');
      }
    }

    async function runDetection() {
      runBtn.disabled = true;
      logEl.innerText = '';
      setStatus('Fetching image...', 'info');

      const imageUrl = imageSelect.value;
      log('Target image: ' + imageUrl);

      try {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = imageUrl;
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error('Failed to download image. CORS restrictions may block this in standard browser files; try running inside the extension context if this fails.'));
        });

        log(`Image loaded successfully (${img.width}x${img.height}).`);
        
        // Letterboxing math
        const targetW = 192;
        const targetH = 192;
        const scale = Math.min(targetW / img.width, targetH / img.height);
        const newW = Math.floor(img.width * scale);
        const newH = Math.floor(img.height * scale);
        const dx = Math.floor((targetW - newW) / 2);
        const dy = Math.floor((targetH - newH) / 2);

        log(`Letterbox proportions: scale=${scale.toFixed(4)}, new dimensions=${newW}x${newH}, dx=${dx}, dy=${dy}`);

        // Draw letterbox on canvas
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, targetW, targetH);
        ctx.drawImage(img, dx, dy, newW, newH);

        const imgData = ctx.getImageData(0, 0, targetW, targetH);
        
        // Convert to planar float format
        const channelSize = targetW * targetH;
        const floatData = new Float32Array(channelSize * 3);
        for (let i = 0; i < channelSize; i++) {
          floatData[i] = imgData.data[i * 4] / 255.0;                 // R plane
          floatData[channelSize + i] = imgData.data[i * 4 + 1] / 255.0;   // G plane
          floatData[channelSize * 2 + i] = imgData.data[i * 4 + 2] / 255.0; // B plane
        }

        const inputTensor = new LiteRT.Tensor(floatData, [1, 3, targetH, targetW]);
        
        log('Running model inference...');
        const startTime = performance.now();
        const results = await compiledModel.run(inputTensor);
        const inferenceTime = (performance.now() - startTime).toFixed(1);
        log(`Model execution completed in ${inferenceTime}ms.`);

        // Move tensor to WASM memory
        const wasmTensor = await results[0].moveTo('wasm');
        const array = wasmTensor.toTypedArray();

        const numClasses = 80;
        const numBoxes = 756;
        let bestBox = null;
        let bestSpecificBox = null;
        let maxScore = 0.25; // threshold
        let maxSpecificScore = 0.25;

        for (let b = 0; b < numBoxes; b++) {
          let maxClassScore = -Infinity;
          let maxClassId = -1;
          for (let c = 0; c < numClasses; c++) {
            const scoreIdx = (4 + c) * numBoxes + b;
            const score = array[scoreIdx];
            if (score > maxClassScore) {
              maxClassScore = score;
              maxClassId = c;
            }
          }

          const confidence = sigmoid(maxClassScore);
          if (confidence > 0.25) {
            const x_center = array[0 * numBoxes + b];
            const y_center = array[1 * numBoxes + b];

            // Filter out boxes centering in padding areas
            const x_center_px = x_center * targetW;
            const y_center_px = y_center * targetH;
            if (x_center_px < dx || x_center_px >= dx + newW || y_center_px < dy || y_center_px >= dy + newH) {
              continue;
            }

            const w = array[2 * numBoxes + b];
            const h = array[3 * numBoxes + b];

            const ymin = Math.max(0, y_center - h / 2);
            const xmin = Math.max(0, x_center - w / 2);
            const ymax = Math.min(1, y_center + h / 2);
            const xmax = Math.min(1, x_center + w / 2);

            if (xmax > xmin && ymax > ymin) {
              const box = { ymin, xmin, ymax, xmax, score: confidence, classId: maxClassId };
              
              if (confidence > maxScore) {
                maxScore = confidence;
                bestBox = box;
              }

              // A box is full-frame relative to the target square if it covers > 85% of both dimensions
              const mapBackX = (val) => {
                const valPixels = val * targetW;
                const activePixels = valPixels - dx;
                return Math.max(0, Math.min(1, activePixels / newW));
              };
              const mapBackY = (val) => {
                const valPixels = val * targetH;
                const activePixels = valPixels - dy;
                return Math.max(0, Math.min(1, activePixels / newH));
              };

              const activeW = mapBackX(xmax) - mapBackX(xmin);
              const activeH = mapBackY(ymax) - mapBackY(ymin);
              const isFullFrame = activeW > 0.85 && activeH > 0.85;

              if (!isFullFrame && confidence > maxSpecificScore) {
                maxSpecificScore = confidence;
                bestSpecificBox = box;
              }
            }
          }
        }

        // If the best box covers the whole image but we found a smaller specific box, use the smaller one!
        if (bestBox) {
          const mapBackX = (val) => {
            const valPixels = val * targetW;
            const activePixels = valPixels - dx;
            return Math.max(0, Math.min(1, activePixels / newW));
          };
          const mapBackY = (val) => {
            const valPixels = val * targetH;
            const activePixels = valPixels - dy;
            return Math.max(0, Math.min(1, activePixels / newH));
          };
          const activeW = mapBackX(bestBox.xmax) - mapBackX(bestBox.xmin);
          const activeH = mapBackY(bestBox.ymax) - mapBackY(bestBox.ymin);
          
          if (activeW > 0.85 && activeH > 0.85) {
            if (bestSpecificBox) {
              log(`[FULL-FRAME OVERRIDE] Overriding full-frame box (Class ${bestBox.classId}, ${Math.round(bestBox.score*100)}%) with smaller localized subject (Class ${bestSpecificBox.classId}, ${Math.round(bestSpecificBox.score*100)}%)`);
              bestBox = bestSpecificBox;
            }
          }
        }

        if (bestBox) {
          const className = COCO_CLASSES[bestBox.classId] || 'subject';
          log(`\nLocalized winner: ${className} (${(bestBox.score * 100).toFixed(1)}% confidence)`);
          log(`Box bounds (relative to target square):`);
          log(`- xmin: ${bestBox.xmin.toFixed(3)}, ymin: ${bestBox.ymin.toFixed(3)}`);
          log(`- xmax: ${bestBox.xmax.toFixed(3)}, ymax: ${bestBox.ymax.toFixed(3)}`);

          setStatus(`Smart Crop Success: found ${className} (${Math.round(bestBox.score * 100)}% confidence)`, 'success');

          // Draw the green bounding box on canvas
          ctx.strokeStyle = '#74ac00';
          ctx.lineWidth = 2;
          const x = bestBox.xmin * targetW;
          const y = bestBox.ymin * targetH;
          const w = (bestBox.xmax - bestBox.xmin) * targetW;
          const h = (bestBox.ymax - bestBox.ymin) * targetH;
          ctx.strokeRect(x, y, w, h);

          // Draw label background
          ctx.fillStyle = '#74ac00';
          ctx.fillRect(x, y - 16, 120, 16);
          ctx.fillStyle = '#fff';
          ctx.font = '10px sans-serif';
          ctx.fillText(`${className}: ${(bestBox.score * 100).toFixed(0)}%`, x + 4, y - 4);
        } else {
          log('\nNo clear foreground subject was localized above the 25% threshold.');
          setStatus('No clear foreground subject detected.', 'warning');
        }

        // Cleanup
        wasmTensor.delete();
        inputTensor.delete();

      } catch (err) {
        log('Detection Error: ' + err.stack);
        setStatus('Detection failed: ' + err.message, 'error');
      } finally {
        runBtn.disabled = false;
      }
    }

    runBtn.addEventListener('click', runDetection);
    window.addEventListener('DOMContentLoaded', initEnvironment);
  </script>
</body>
</html>
